<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلطع برجر - تواصل معنا</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-[#0b131a] to-[#121f2c] flex items-center justify-center min-h-screen p-4">

    <!-- الكارد الرئيسي باللون الداكن الفخم المتناسق مع خلفية اللوجو -->
    <div class="bg-[#1a2633]/90 backdrop-blur-md p-8 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] max-w-sm w-full text-center border border-white/5">
        
        <!-- إطار اللوجو الجديد مع بوردر برتقالي ناري وتأثير توهج (Glow) خفيف -->
        <div class="w-44 h-44 rounded-2xl overflow-hidden mx-auto mb-6 border-4 border-[#ff6b00] shadow-[0_0_20px_rgba(255,107,0,0.3)] bg-black flex items-center justify-center group">
            <img src="https://i.postimg.cc/sxyRW7Ph/IMG-20260711-WA0010.jpg" 
                 alt="سلطع برجر لوجو جديد" 
                 class="w-full h-full object-cover scale-110 object-center transition duration-300 group-hover:scale-125">
        </div>

        <!-- اسم المطعم باللون الأبيض الناصع -->
        <h1 class="text-3xl font-black text-white mb-2 tracking-wide">سلطع برجر</h1>
        
        <!-- شعار المطعم بالبرتقالي الصريح لفتح الشهية والتناسق مع البرجر -->

        <!-- نص ترحيبي بالرمادي الفاتح المريح للعين على الخلفيات الداكنة -->
        <p class="text-xs text-slate-400 leading-relaxed mb-8 font-medium">يسعدنا تواصلك معنا، اختر الطريقة المناسبة لك لجلب السعادة لمعدتك:</p>

        <!-- أزرار التواصل بالتنسيق الجديد -->
        <div class="space-y-4">
            <!-- زرار الواتساب (تم الحفاظ على لونه للثقة والهوية الخاصة بالبرنامج ولكن بتأثير داكن متناسق) -->
            <a href="https://wa.me/201145841110" target="_blank" 
               class="flex items-center justify-center gap-3 w-full bg-[#1ebd5d] hover:bg-[#19a450] text-white font-bold py-3.5 px-6 rounded-2xl transition duration-300 transform hover:-translate-y-1 shadow-[0_4px_15px_rgba(30,189,93,0.3)] text-lg">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                طلب عبر الواتساب
            </a>

            <!-- زرار الاتصال المباشر (تم تعديله للبرتقالي الناري المتناسق مع لوجو السماش برجر) -->
            <a href="tel:+201080308482" 
               class="flex items-center justify-center gap-3 w-full bg-[#ff6b00] hover:bg-[#e05e00] text-white font-bold py-3.5 px-6 rounded-2xl transition duration-300 transform hover:-translate-y-1 shadow-[0_4px_15px_rgba(255,107,0,0.3)] text-lg">
                <i class="fa-solid fa-phone text-xl text-white"></i>
                إتصال هاتفي مباشر
            </a>
        </div>

        <!-- تذييل الصفحة -->

        <div class="mt-8 pt-4 border-t border-white/5 text-[11px] text-slate-400 font-sans tracking-wide">
    Designed with ❤️ by <span class="text-[#ff6b00] font-bold">Mahmoud Abdellatef</span>
</div>

</html>
